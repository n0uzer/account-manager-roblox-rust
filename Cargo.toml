[package]
name = "rbm"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "Локальный open-source менеджер аккаунтов Roblox"
license = "MIT"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
open = "5"
arboard = "3"
urlencoding = "2"
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
